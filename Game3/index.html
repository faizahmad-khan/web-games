<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Snake & Ladder Game! A classic board game with up to 4 players. Roll the dice and climb to victory!">
    <meta name="theme-color" content="#667eea">
    <meta name="color-scheme" content="light dark">
    <title>🐍 Snake & Ladder - Classic Board Game</title>
    <link rel="stylesheet" href="snake_ladder.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="game-title">🐍 Snake & Ladder 🪜</h1>
            <div class="header-controls">
                <button class="icon-btn" id="darkModeToggle" onclick="toggleDarkMode()" title="Toggle Dark Mode" aria-label="Toggle dark mode">🌙</button>
                <button class="icon-btn" id="soundToggle" onclick="toggleSound()" title="Toggle Sound" aria-label="Toggle sound effects">🔊</button>
            </div>
        </div>
        
        <!-- Setup Screen -->
        <div id="setupScreen" class="setup-screen">
            <div class="setup-card">
                <h2>Game Setup</h2>
                <div class="setup-group">
                    <label for="playerCount">Number of Players (2-4):</label>
                    <input type="number" id="playerCount" min="2" max="4" value="2">
                </div>
                <button class="btn btn-primary" onclick="setupPlayers()" aria-label="Continue to player setup">Next</button>
            </div>
        </div>

        <!-- Player Name & Color Selection Screen -->
        <div id="colorScreen" class="color-screen hidden">
            <div class="color-card">
                <h2>Customize Players</h2>
                <div id="playerColorSelection"></div>
                <button class="btn btn-primary" onclick="startGame()" aria-label="Start the game">Start Game</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="game-screen hidden">
            <div class="game-controls">
                <div class="players-info" id="playersInfo"></div>
                <div class="control-buttons">
                    <button class="btn btn-success" id="rollDiceBtn" onclick="rollDice()" aria-label="Roll the dice">🎲 Roll Dice</button>
                    <button class="btn btn-warning" onclick="resetGame()" aria-label="Reset the game">🔄 Reset Game</button>
                    <button class="btn btn-danger" onclick="exitGame()" aria-label="Exit the game">🚪 Exit Game</button>
                </div>
                <div class="dice-container">
                    <div id="diceDisplay" class="dice">
                        <div class="dice-face"></div>
                    </div>
                    <p id="diceMessage"></p>
                </div>
                
                <!-- Statistics Panel -->
                <div class="stats-panel">
                    <h4>📊 Game Stats</h4>
                    <div id="statsContent"></div>
                </div>
            </div>

            <div class="board-container">
                <canvas id="gameBoard" width="600" height="600"></canvas>
                <div id="powerUpNotification" class="power-up-notification hidden"></div>
            </div>

            <div class="game-info">
                <h3>Current Turn: <span id="currentTurn"></span></h3>
                <div class="legend">
                    <div class="legend-item">
                        <span class="legend-icon">⭐</span>
                        <span>Extra Turn</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">🛡️</span>
                        <span>Shield</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">⚡</span>
                        <span>Speed Boost</span>
                    </div>
                </div>
                <div id="gameLog" class="game-log"></div>
            </div>
        </div>

        <!-- Winner Modal -->
        <div id="winnerModal" class="modal hidden">
            <div class="modal-content">
                <div class="confetti-container" id="confettiContainer"></div>
                <h2>🎉 Congratulations! 🎉</h2>
                <p id="winnerText"></p>
                <div class="winner-stats" id="winnerStats"></div>
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="resetGame()" aria-label="Play again">Play Again</button>
                    <button class="btn btn-danger" onclick="exitGame()" aria-label="Exit the game">Exit</button>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align:center; padding:15px; margin-top:20px; color:#999; font-size:16px; font-weight:bold;">
        <p>🐍 Snake & Ladder | Developed by Faiz Ahmad Khan</p>
        <p style="font-size:12px; margin-top:5px;">Made with ❤️ using HTML5, CSS3 & JavaScript</p>
    </footer>

    <script src="snake_ladder.js"></script>
</body>
</html>
