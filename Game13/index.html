<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <h1>Hangman Game</h1>
        <p class="subtitle">Guess the word by selecting letters. Each wrong guess brings the hangman closer!</p>

        <!-- Top controls -->
        <div class="top-controls">
            <div class="control-group">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="control-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="all" selected>All</option>
                    <option value="tech">Tech</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="gaming">Gaming</option>
                </select>
            </div>
        </div>

        <!-- Stats bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-icon">🏆</span>
                <span>Level: <strong id="levelDisplay">1</strong></span>
            </div>
            <div class="stat">
                <span class="stat-icon">🔥</span>
                <span>Streak: <strong id="streakDisplay">0</strong></span>
            </div>
            <div class="stat">
                <span class="stat-icon">⏱️</span>
                <span>Time: <strong id="timerDisplay">--</strong></span>
            </div>
            <div class="stat">
                <span class="stat-icon">❤️</span>
                <span>Left: <strong id="livesDisplay">6</strong></span>
            </div>
        </div>

        <!-- Hangman canvas -->
        <div class="hangman-display">
            <canvas id="hangmanCanvas" width="300" height="300"></canvas>
        </div>

        <!-- Word display -->
        <div class="word-display">
            <div id="wordPlaceholder">_ _ _ _ _ _</div>
        </div>

        <!-- Hint -->
        <div class="hint-section">
            <h3>Hint:</h3>
            <p id="hintDisplay" class="hint-text"></p>
        </div>

        <!-- Incorrect letters -->
        <div class="incorrect-letters">
            <p>Incorrect Letters: <span id="incorrectLettersDisplay"></span></p>
        </div>

        <!-- Alphabet buttons -->
        <div class="alphabet-container"></div>

        <!-- Controls -->
        <div class="game-controls">
            <button id="restartButton">Restart Game</button>
        </div>

        <!-- Keyboard hint -->
        <p class="keyboard-hint">Use your keyboard to guess letters &nbsp;|&nbsp; <kbd>Enter</kbd> to restart</p>

        <!-- Game message -->
        <div id="gameMessage" class="message"></div>
    </div>

    <footer>
        <p>Developed by Faiz Ahmad Khan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
