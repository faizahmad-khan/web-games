<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <h1>Tic Tac Toe</h1>

        <!-- Mode & Difficulty -->
        <div class="top-controls">
            <div class="mode-selector">
                <label for="game-mode">Mode:</label>
                <select id="game-mode">
                    <option value="pvp">Player vs Player</option>
                    <option value="ai">Player vs AI</option>
                </select>
            </div>
            <div class="difficulty-selector hidden" id="difficulty-group">
                <label for="difficulty">AI:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <!-- Turn & Scores -->
        <div class="game-info">
            <div class="current-player">Player <span id="current-player">X</span>'s Turn</div>
            <div class="score">
                <div class="score-item">
                    <span class="player-x">X</span>: <span id="score-x">0</span>
                </div>
                <div class="score-item">
                    <span class="player-o">O</span>: <span id="score-o">0</span>
                </div>
                <div class="score-item">
                    Draws: <span id="score-draw">0</span>
                </div>
            </div>
        </div>

        <!-- Board -->
        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="reset-btn">Reset Game</button>
            <button id="new-game-btn">New Game</button>
        </div>

        <!-- Keyboard hint -->
        <p class="keyboard-hint">Use keys <kbd>1</kbd>–<kbd>9</kbd> to play &nbsp;|&nbsp; <kbd>R</kbd> to reset</p>

        <!-- Win / Draw overlay -->
        <div id="message" class="message hidden">
            <div class="message-text">X Wins!</div>
            <button id="another-round-btn" class="another-round-btn">Another Round</button>
        </div>
    </div>

    <footer>
        <p>Developed by Faiz Ahmad Khan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
