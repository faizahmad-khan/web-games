<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Flappy Bird</title>
    <link rel="stylesheet" href="flappybird.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="ui-container">
            <div id="score">0</div>
            <div id="high-score">High Score: <span id="high-score-value">0</span></div>
            <div id="difficulty">Difficulty: <span id="difficulty-value">Easy</span></div>
            <button id="pause-btn" class="hud-btn hidden" aria-label="Pause game">Pause</button>
            <div id="tap-hint">Tap / Space to flap</div>
            <div id="achievement-toast" class="hidden" role="status" aria-live="polite"></div>
            <div id="start-screen">
                <h1>Flappy Bird</h1>
                <p>Press SPACE or tap to fly</p>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="game-over" class="hidden">
                <h2>Game Over!</h2>
                <p>Score: <span id="final-score">0</span></p>
                <p>High Score: <span id="game-over-high-score">0</span></p>
                <p>Medal: <span id="medal-value">None</span></p>
                <div id="unlocked-achievements" class="achievements-list"></div>
                <button id="restart-btn">Play Again</button>
            </div>
            <div id="pause-overlay" class="hidden">
                <h2>Paused</h2>
                <p>Press P, Escape, or Pause to continue</p>
            </div>
        </div>
    </div>
    <footer style="text-align:center; padding:15px; margin-top:20px; color:#ccc; font-size:16px; font-weight:bold;">
        <p>Developed by Faiz Ahmad Khan</p>
    </footer>

    <script src="flappybird.js"></script>
</body>
</html>
