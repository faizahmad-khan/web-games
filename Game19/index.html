<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Skyline Sprint is a fast dodge game where you weave through traffic and chase a high score.">
    <meta name="theme-color" content="#08131f">
    <title>Skyline Sprint</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scene"></div>

    <main class="app">
        <header class="topbar">
            <div>
                <p class="kicker">Game 19</p>
                <h1>Skyline Sprint</h1>
            </div>
            <button id="start-btn" class="start-btn" type="button">Start Run</button>
        </header>

        <section class="hud" aria-label="Game status">
            <div class="stat">
                <span class="label">Score</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="stat">
                <span class="label">Best</span>
                <span id="best" class="value">0</span>
            </div>
            <div class="stat status-pill">
                <span class="label">Status</span>
                <span id="status" class="value">Idle</span>
            </div>
        </section>

        <section class="arena" aria-label="Game arena">
            <canvas id="game-canvas" width="360" height="600" aria-label="Skyline Sprint game canvas"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">Ready?</h2>
                <p id="overlay-text">Move left and right. Dodge every incoming block.</p>
            </div>
        </section>

        <section class="controls" aria-label="Controls">
            <p>
                Desktop: Arrow keys or A / D. Press P to pause.<br>
                Mobile: Hold touch controls below.
            </p>
            <div class="touch-controls">
                <button id="left-btn" class="touch-btn" type="button" aria-label="Move left">Left</button>
                <button id="right-btn" class="touch-btn" type="button" aria-label="Move right">Right</button>
            </div>
        </section>
    </main>

    <footer>
        Skyline Sprint | Developed by Faiz Ahmad Khan
    </footer>

    <script src="script.js"></script>
</body>
</html>
